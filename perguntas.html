  :root {

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  body {
    margin: 0;
    padding: 40px 18px 80px;
    background-color: var(--rosa);
    color: var(--texto);
    font-family: "Nunito", "Helvetica Neue", Helvetica, Arial, sans-serif;

  }

  .container { max-width: 1080px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 30px; }

  .faixa {

    font-weight: 800;
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #fff;
    background: var(--azul);
    padding: 8px 18px;
    border-radius: 7px;
    transform: rotate(-2deg);
    box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.18);
    margin-bottom: 14px;
  }

  h1 {
    font-family: "Baloo 2", sans-serif;
    font-weight: 800;
    font-size: 30px;
    line-height: 1.1;
    color: #fff;
    text-shadow: 3px 3px 0 var(--azul-2);
    margin: 0 0 8px;
  }

  header p.sub {
    margin: 0;
    font-size: 14.5px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
  }

  .fase-titulo {
    font-family: "Baloo 2", sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.2);
    margin: 36px 0 18px;
    padding-bottom: 10px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.35);
  }
  .fase-titulo:first-of-type { margin-top: 6px; }

  .categoria { margin-bottom: 26px; }

  .categoria-titulo {
    display: inline-block;
    font-family: "Baloo 2", sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--texto);
    background: var(--gelo);
    border-radius: 999px;
    padding: 10px 18px;
    margin: 0 0 16px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.14);
  }

  .grid-perguntas {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  @media (min-width: 720px) {
    .grid-perguntas { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
  }

  .card-pergunta {
    background: var(--gelo);
    border-radius: 14px;
    padding: 18px 18px 16px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
  }

  .texto-pergunta {
    font-size: 18px;
    font-weight: 800;
    line-height: 1.45;
    color: var(--texto);
    margin: 0 0 14px;
  }

  .resposta {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .resposta-caixa {
    flex: 1;
    min-width: 0;
    border-radius: 10px;
    padding: 13px 14px;
    background: #6e6e6e;
    transition: background 0.25s ease;
  }

  .resposta-caixa span {
    display: block;
    font-size: 17px;
    font-weight: 800;
    line-height: 1.4;
    color: #6e6e6e;
    transition: color 0.25s ease;
  }

  .resposta-caixa.revelada { background: #eef1fb; }
  .resposta-caixa.revelada span { color: var(--azul); }

  .botao-olho-resposta {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: #ececec;
    color: var(--apagado);
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, color 0.15s ease, transform 0.12s ease;
  }
  .botao-olho-resposta:hover { background: #dfe6fa; color: var(--azul); }
  .botao-olho-resposta:active { transform: scale(0.92); }

  footer.creditos {
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.85);
  }
</style>

  function criarCard(pergunta, resposta) {
    const card = document.createElement("div");
    card.className = "card-pergunta";

    const p = document.createElement("p");
    p.className = "texto-pergunta";
    p.textContent = pergunta;

    const respostaWrap = document.createElement("div");
    respostaWrap.className = "resposta";

    const caixa = document.createElement("div");
    caixa.className = "resposta-caixa";
    const span = document.createElement("span");
    span.textContent = resposta;
    caixa.appendChild(span);

    const botao = document.createElement("button");
    botao.type = "button";
    botao.className = "botao-olho-resposta";
    botao.innerHTML = ICONE_OLHO_FECHADO;
    botao.title = "Revelar resposta";
    botao.onclick = () => {
      const revelada = caixa.classList.toggle("revelada");
      botao.innerHTML = revelada ? ICONE_OLHO_ABERTO : ICONE_OLHO_FECHADO;
      botao.title = revelada ? "Ocultar resposta" : "Revelar resposta";
    };

    respostaWrap.append(caixa, botao);
    card.append(p, respostaWrap);
    return card;
  }

  function montarPagina() {
    const raiz = document.getElementById("conteudo");
    DADOS.forEach((faseObj) => {
      const h2 = document.createElement("h2");
      h2.className = "fase-titulo";
      h2.textContent = faseObj.fase;
      raiz.appendChild(h2);

      faseObj.categorias.forEach((cat) => {
        const catDiv = document.createElement("div");
        catDiv.className = "categoria";

        const h3 = document.createElement("h3");
        h3.className = "categoria-titulo";
        h3.textContent = cat.titulo;
        catDiv.appendChild(h3);

        const grid = document.createElement("div");
        grid.className = "grid-perguntas";
        cat.perguntas.forEach(([pergunta, resposta]) => grid.appendChild(criarCard(pergunta, resposta)));
        catDiv.appendChild(grid);

        raiz.appendChild(catDiv);
      });
    });
  }
